<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SpendWise — Track expenses, set budgets, and visualize spending with beautiful charts. Free MERN stack expense tracker with ₹ INR support." />
    <meta name="theme-color" content="#0d0908" />
    <title>SpendWise — Smart Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text y='.9em' font-size='68' x='15' fill='white'>₹</text></svg>" />
    <style>
      /* Applied before any JS — prevents white flash on any browser */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        background: #0d0908;
        overflow: hidden;     /* html is NOT the scroll container */
        height: 100%;
        touch-action: pan-y;
      }
      body {
        background: #0d0908;
        height: 100%;
        overflow-x: hidden;
        overflow-y: scroll;   /* body IS the scroll container */
        overscroll-behavior: none;
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        background: #0d0908;
        min-height: 100vh;
      }
      ::-webkit-scrollbar-track { background: #0d0908; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
